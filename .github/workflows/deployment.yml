name: MS Notifications Deploy

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  CONTAINER_NAME: ms-notifications
  HOST_PORT: 8082
  CONTAINER_PORT: 8080

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build JAR
        run: |
          chmod +x ./mvnw
          ./mvnw clean package

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ms-notifications:latest .
          docker tag ms-notifications:latest \
            ${{ secrets.ECR_REPO_URL_MS_NOTIFICATIONS }}:latest

      - name: Push image to ECR
        run: |
          docker push \
            ${{ secrets.ECR_REPO_URL_MS_NOTIFICATIONS }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPO: ${{ secrets.ECR_REPO_URL_MS_NOTIFICATIONS }}
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_PORT: ${{ secrets.RABBITMQ_PORT }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_REGION,ECR_REGISTRY,ECR_REPO,RABBITMQ_HOST,RABBITMQ_PORT,RABBITMQ_USERNAME,RABBITMQ_PASSWORD

          script: |
            set -e

            echo "Logging into ECR..."

            aws ecr get-login-password \
              --region "$AWS_REGION" \
              | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

            echo "Pulling ms-notifications..."

            docker pull "$ECR_REPO:latest"

            echo "Stopping previous container..."

            docker stop ms-notifications || true
            docker rm ms-notifications || true

            echo "Starting ms-notifications..."

            docker run -d \
            --name ms-notifications \
            --restart unless-stopped \
            -p 8082:8080 \
            -e SPRING_RABBITMQ_HOST="$RABBITMQ_HOST" \
            -e SPRING_RABBITMQ_PORT="$RABBITMQ_PORT" \
            -e SPRING_RABBITMQ_USERNAME="$RABBITMQ_USERNAME" \
            -e SPRING_RABBITMQ_PASSWORD="$RABBITMQ_PASSWORD" \
            "$ECR_REPO:latest"

            echo "Deployment completed."

            docker ps
