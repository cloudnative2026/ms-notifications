spring.application.name=ms-notifications
server.port=8080

# rabbitmq
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672

spring.rabbitmq.username=${SPRING_RABBITMQ_USER:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin123}


# rabbitmq infra
app.rabbitmq.exchange=${APP_RABBITMQ_EXCHANGE:notifications.exchange}
app.rabbitmq.queue=${APP_RABBITMQ_QUEUE:notifications.queue}
app.rabbitmq.routing-key=${APP_RABBITMQ_ROUTINGKEY:notifications.routingkey}

# reintentos con backoff, al agotarlos el mensaje se rechaza sin requeue y va a la DLQ
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# entra id
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER:https://login.microsoftonline.com/f9bce5c0-eb96-4341-aad7-411ae980b12a/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE:c1e3acd7-4501-432e-a446-71ab2dca8ac3}
